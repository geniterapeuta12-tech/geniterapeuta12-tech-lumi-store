<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8d2f61">
<title>Abrindo Lumi Clínica Mobile</title>
<style>
body{margin:0;display:grid;place-items:center;min-height:100vh;background:linear-gradient(145deg,#fff7fb,#f5dce9);color:#6f2851;font:600 16px system-ui}.box{text-align:center;padding:30px}.logo{width:68px;height:68px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#b84e83,#702149);color:#fff;display:grid;place-items:center;font-size:32px;box-shadow:0 18px 45px #8d2f6133}.spin{width:34px;height:34px;margin:20px auto;border:4px solid #efd4e2;border-top-color:#8d2f61;border-radius:50%;animation:s .8s linear infinite}small{display:block;color:#96788a}p{max-width:340px;line-height:1.5;color:#806b77}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="logo">L</div><b>Abrindo Lumi Clínica</b><div class="spin"></div><small>Carregando a versão mobile oficial…</small></div>
<script>
(async()=>{
 try{
   const names=['mobile-00.part','mobile-01.part','mobile-02.part','mobile-03.part','mobile-04.part'];
   const parts=await Promise.all(names.map(name=>fetch(name,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Parte não encontrada');return r.text()})));
   const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
   if(!('DecompressionStream' in window))throw new Error('Navegador sem descompactação');
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const html=await new Response(stream).text();
   document.open();document.write(html);document.close();
 }catch(error){
   document.body.innerHTML='<div class="box"><div class="logo">L</div><b>Não foi possível abrir automaticamente.</b><p>Atualize o Google Chrome e tente novamente.</p></div>';
   console.error(error);
 }
})();
</script>
</body>
</html>
